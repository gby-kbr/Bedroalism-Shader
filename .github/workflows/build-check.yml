name: Build-Check

# Runs the same compilation as the Build workflow, to find out whether the shader is ready to build and to
# find the errors in the functions. No pack is made and nothing is uploaded.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tool/**'
      - 'requirements.txt'
      - 'build.bat'
      - '.github/workflows/build-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Direct3D shaders can only be compiled on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - uses: actions/cache@v6
        with:
          key: build-tools-win-${{ hashFiles('tool/util.py') }}
          path: tool/data

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Setup build tool
        run: .\build.bat setup

      - name: Compile materials
        run: .\build.bat mats -p multiplatform
