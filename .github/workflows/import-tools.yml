name: Import-Tools

# Run once. Copies the build dependencies (the shaderc compiler for every platform and the vanilla material
# definitions) from the dev release of Newb Shader to the "build-tools" release of this repository, which the
# build tool uses first. Run it again to refresh them.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE: https://github.com/devendrn/newb-shader/releases/download/dev
  ASSETS: >-
    src-materials-1.26.60.zip
    shaderc-win-x64.exe
    shaderc-linux-x64
    shaderc-osx-x64
    shaderc-android-arm64
    shaderc-android-arm

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Download from Newb Shader
        run: |
          mkdir tools
          for asset in $ASSETS; do
            curl --fail --location --retry 3 --output "tools/$asset" "$SOURCE/$asset"
          done
          ls -l tools

      - name: Publish to the build-tools release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view build-tools --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create build-tools --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Build tools" \
              --notes "Build dependencies of the material compiler: shaderc for every platform and the vanilla material definitions. Imported from the dev release of devendrn/newb-shader. Used by the setup command of the build tool."
          fi
          gh release upload build-tools tools/* --repo "$GITHUB_REPOSITORY" --clobber
