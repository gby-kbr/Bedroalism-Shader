name: Build

# Compiles the materials for Android, iOS and Windows (one multiplatform pack) and publishes the pack
# as a .mcpack file. The file is uploaded as it is, not wrapped in a .zip. The pack is the content of the
# mcpack folder with its own manifest.json: change the version there by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Direct3D shaders can only be compiled on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - uses: actions/cache@v6
        with:
          key: build-tools-win-${{ hashFiles('tool/util.py') }}
          path: tool/data

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Setup build tool
        run: .\build.bat setup

      - name: Build pack
        run: .\build.bat pack -p multiplatform

      - name: Upload pack
        uses: actions/upload-artifact@v7
        with:
          path: build/*.mcpack
          archive: false
          if-no-files-found: error
