name: Build

# Compiles the materials for Android, iOS and Windows (one multiplatform pack) and publishes the pack
# as a .mcpack file. The file is uploaded as it is, not wrapped in a .zip.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Patch number of the pack version (eg: 3 gives 0.1.3). Empty keeps the version of mcpack/manifest.json'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    # Direct3D shaders can only be compiled on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - uses: actions/cache@v6
        with:
          key: build-tools-win-${{ hashFiles('tool/util.py') }}
          path: tool/data

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Setup build tool
        run: .\build.bat setup

      - name: Build pack
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ($version) {
            .\build.bat pack -p multiplatform -v $version
          } else {
            .\build.bat pack -p multiplatform
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload pack
        uses: actions/upload-artifact@v7
        with:
          path: build/*.mcpack
          archive: false
          if-no-files-found: error
